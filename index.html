<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeyondWords Player</title>
  </head>
  <body>
    <script>
      // Lets the control panel keep this page's URL in step with the settings.
      // Only this page: an integrator using the controlPanel setting on their
      // own site should not have their address bar rewritten.
      window.__beyondwordsHarness = true;
    </script>

    <div class="control-panel"></div>

    <h1>BeyondWords Player</h1>

    <!-- The player, then the article rebuilt from whatever content is loaded.
         Both are direct children of <body>, and the CSS below constrains the
         player to 32rem: the screenshot baselines were captured that way. -->
    <div id="player"></div>
    <div id="article"></div>

    <!-- Keeps the page taller than the viewport whether or not any content
         loaded, so scrolling still elects the bottom widget. -->
    <div id="scroll-space"></div>

    <script type="module" src="/harness/main.js"></script>

    <script id="player-script" async defer type="module" onload="window.BeyondWordsHarness?.boot()"></script>

    <script>
      const script = document.querySelector("#player-script");
      const isLocal = location.hostname === "localhost" || location.hostname.includes("ngrok-free");

      script.src = isLocal ? "src/index.ts" : "https://proxy.beyondwords.io/npm/@beyondwords/player@0.4.8/dist/umd.js";
    </script>

    <style>
      body {
        font-family: Arial;
      }

      h1, h2,  p, .beyondwords-player {
        max-width: 32rem;
        margin: 2rem auto;
        line-height: 1.4;
        text-align: justify;
      }

      h2 {
        margin-top: 4rem;
      }

      #scroll-space {
        height: 200vh;
      }

      .control-panel {
        position: fixed;
        top: 0;
        right: 0;
        width: 300px;
        padding: 16px;
        height: calc(100% - 115px);
        overflow-y: scroll;
        background: white;
        box-shadow: 0 0 0.5rem rgba(0, 0, 0, 0.2);
      }

      @media only screen and (max-width: 1200px) {
        .control-panel {
          display: none;
        }
      }

      /* Check that styles from the website do not interfere with the player. */
      .bwp.bwp.bwp.bwp.bwp.bwp.bwp.bwp.bwp.bwp.bwp .main,
      .bwp.bwp.bwp.bwp.bwp.bwp.bwp.bwp.bwp.bwp.bwp .default-player {
        border: 5px dashed red !important;  /* Should not override. */
        border-radius: 0 !important;        /* Should not override. */
      }
    </style>
  </body>
</html>
